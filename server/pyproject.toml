[project]
name = "team-mcp"
version = "0.1.0"
description = "Remote MCP messaging, shared state and artifact storage"
requires-python = ">=3.14.10,<3.15"
dependencies = [
    "fastmcp==4.2.5",
    "mcp==2.3.0",
    "boto3==1.44.10",
    "botocore==1.44.10",
    "pydantic==2.14.4",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = ["pytest==9.2.0"]

[project.scripts]
team-mcp = "team_mcp.cli:main"

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires the Compose test stack", "large: transfers GiB-sized files"]

[tool.hatch.build.targets.wheel]
packages = ["src/team_mcp"]
